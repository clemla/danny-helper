services:
  bot:
    container_name: danny-helper
    io.portainer.accesscontrol.teams: "1"

    build:
      context: .

    environment:
      NODE_ENV: production

    restart: unless-stopped

    volumes:
      - .:/app
      - /app/node_modules

    command: sh -c "git pull --ff-only && bun run main.js"
